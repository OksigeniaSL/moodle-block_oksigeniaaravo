# Moodle Plugin CI — runs the suite that moodle.org/plugins reviewers expect
# (validate, lint, codechecker, phpdoc, savepoints, mustache, grunt) plus the
# plugin's own PHPUnit tests, on every Moodle branch from 4.1 to 5.3.
#
# The main job tracks the next Moodle release. It is allowed to fail so
# upstream breakage shows up early without turning the run red.
#
# Reference template: https://github.com/moodlehq/moodle-plugin-ci
name: Moodle Plugin CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.experimental || false }}

    services:
      postgres:
        # 5.3+ needs PostgreSQL 17 (the install runs the environment check);
        # the older branches stay on 16.
        image: postgres:${{ matrix.pg || '16' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: MOODLE_401_STABLE
            php: '7.4'
            database: pgsql
            node: '22'
          - moodle-branch: MOODLE_402_STABLE
            php: '8.2'
            database: pgsql
            node: '20'
          - moodle-branch: MOODLE_403_STABLE
            php: '8.2'
            database: pgsql
            node: '22'
          - moodle-branch: MOODLE_404_STABLE
            php: '8.3'
            database: pgsql
            node: '22'
          - moodle-branch: MOODLE_405_STABLE
            php: '8.1'
            database: pgsql
            node: '20'
          - moodle-branch: MOODLE_500_STABLE
            php: '8.2'
            database: pgsql
            node: '20'
          - moodle-branch: MOODLE_503_STABLE
            php: '8.3'
            database: pgsql
            node: '22'
            pg: '17'
          - moodle-branch: main
            php: '8.4'
            database: pgsql
            node: '22'
            pg: '17'
            experimental: true

    steps:
      - name: Check out plugin code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, soap, xmlrpc, mbstring, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin"    >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle (${{ matrix.moodle-branch }})
        run: |
          moodle-plugin-ci install \
            --plugin=$(pwd)/plugin \
            --db-host=127.0.0.1 \
            --db-user=postgres \
            --db-pass='' \
            --db-name=moodle \
            --db-type=${{ matrix.database }} \
            --branch=${{ matrix.moodle-branch }}
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: validate
        if: always()
        run: moodle-plugin-ci validate

      - name: phplint
        if: always()
        run: moodle-plugin-ci phplint

      - name: phpmd
        if: always()
        run: moodle-plugin-ci phpmd

      - name: codechecker
        if: always()
        run: moodle-plugin-ci codechecker

      - name: phpdoc
        if: always()
        run: moodle-plugin-ci phpdoc

      - name: savepoints
        if: always()
        run: moodle-plugin-ci savepoints

      - name: mustache
        if: always()
        run: moodle-plugin-ci mustache

      - name: grunt
        if: always()
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: phpunit
        if: always()
        run: moodle-plugin-ci phpunit --fail-on-warning
